[project]
name = "alicepet-scene-depth"
version = "0.1.0"
description = "One-shot single-image metric depth & camera estimator (MoGe-2) for AlicePet Picture-World mode"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<2.3",
    "pillow>=10.0",
    "opencv-python-headless>=4.10",
    "scipy>=1.13",
    "torch>=2.5",
    "torchvision>=0.20",
    "huggingface-hub>=0.25",
    "timm>=1.0",
    "einops>=0.8",
    "trimesh>=4.0",
    "utils3d @ git+https://github.com/EasternJournalist/utils3d.git",
]
